<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海外售后诊断工作台 脱敏重绘</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="../index.html">FIELD / 诊断平台</a><p class="side-label">售后服务工作区</p><nav aria-label="主要导航"><button data-page="devices" class="active">01　设备中心</button><button data-page="alarms">02　告警中心</button><button data-page="diagnosis">03　远程诊断</button><button data-page="permissions">04　权限管理</button></nav><div class="side-bottom">脱敏重绘<br>模拟数据 / 本地演示<br><a href="../index.html">← 返回作品集</a></div></aside><div class="workspace"><header class="topbar"><span>海外售后 / 工程师工作区</span><div><span class="tag">演示环境</span>　演示工程师</div></header><div class="demo-banner">脱敏重绘 · 所有设备、告警、数值与诊断建议均为模拟内容。所有操作仅在当前浏览器中演示。</div><main id="content"></main><footer class="app-footer">产品交互演示 · 不连接真实设备 · 刷新页面后恢复初始状态</footer></div><dialog id="detail"><div id="detail-body"></div><form method="dialog"><button class="secondary">关闭详情</button></form></dialog><dialog id="request"><h2>申请临时远程操作权限</h2><p>设备 <b id="request-device"></b> · 权限范围：远程工程模式</p><form id="request-form"><label>授权时长<select id="duration"><option>30分钟</option><option>1小时</option><option>2小时</option></select></label><label>申请原因<textarea id="reason" required minlength="5" placeholder="请说明排查任务与操作目的，至少5字"></textarea></label><p class="muted">演示流程：提交后进入待审批状态，不产生真实授权。</p><div class="actions"><button type="button" class="secondary" id="cancel-request">取消</button><button class="primary" type="submit">提交申请</button></div></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
